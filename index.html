<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generative Media Art Lab + Studio</title>
  <link rel="stylesheet" href="CSS/mainstyle.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Noto+Sans+KR:wght@100..900&family=Space+Grotesk:wght@300..700&display=swap"
    rel="stylesheet">
</head>

<body class="intro-only">
  <div class="section-container">
    <section id="intro" class="section-box">
      <div class="intro-section">
        <div class="intro-text">
          <span class="word">We</span>
          <span id="eng.v1" class="fade-text word"></span>
          <span id="eng.o1" class="fade-text word"></span>
          <span class="word">within</span>
          <span id="eng.pp1" class="fade-text word"></span>
        </div>
        <div class="intro-text korean">
          <span id="kr.pp1" class="fade-text word"></span>
          <span class="word">속에서</span>
          <span id="kr.o1" class="fade-text word"></span>
          <span id="kr.v1" class="fade-text word"></span>
        </div>
        <div class="intro-text">
          <span class="word">We</span>
          <span id="eng.v2" class="fade-text word"></span>
          <span id="eng.o2" class="fade-text word"></span>
          <span class="word">through</span>
          <span id="eng.pp2" class="fade-text word"></span>
        </div>
        <div class="intro-text korean">
          <span id="kr.pp2" class="fade-text word"></span>
          <span class="word">통해</span>
          <span id="kr.o2" class="fade-text word"></span>
          <span id="kr.v2" class="fade-text word"></span>
        </div>
        <div class="intro-text">
          <span class="word">We</span>
          <span id="eng.v3" class="fade-text word"></span>
          <span id="eng.o3" class="fade-text word"></span>
          <span class="word">where</span>
          <span id="eng.adv" class="fade-text word"></span>
        </div>
        <div class="intro-text korean">
          <span id="kr.adv" class="fade-text word"></span>
          <span class="word">지점에서</span>
          <span id="kr.o3" class="fade-text word"></span>
          <span id="kr.v3" class="fade-text word"></span>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="js/3d_script.js"></script>
  <script defer src="js/text_animation.js"></script>
</body>
</html>
