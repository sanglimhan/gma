<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a78">
  <title>Generative Media Art Lab + Studio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="signal" aria-labelledby="signal-title">
    <div class="grid" aria-hidden="true"></div>
    <canvas id="noise" aria-hidden="true"></canvas>
    <header class="identity"><span>Chung-Ang University</span><span>G S A I M <i aria-hidden="true"></i></span></header>
    <div class="objects" aria-hidden="true">
      <div class="orbit orbit-a"><div class="jelly jelly-cyan"></div></div>
      <div class="orbit orbit-b"><div class="jelly jelly-pink"></div></div>
      <div class="orbit orbit-c"><div class="chrome"></div></div>
      <svg class="spark" viewBox="0 0 100 100"><path d="M50 0 58 35 85 15 65 42 100 50 65 58 85 85 58 65 50 100 42 65 15 85 35 58 0 50 35 42 15 15 42 35Z"/></svg>
    </div>
    <section class="transmission">
      <p class="eyebrow">Art, in a state of becoming.</p>
      <h1 id="signal-title"><span class="line line-one">Generative</span><span class="line line-two">Media Art<span class="asterisk" aria-hidden="true">✳</span></span><span class="line line-three">Lab <span class="plus">+</span> Studio</span></h1>
      <div class="hero-bottom"><p>Exploring the poetic logic<br>of generative systems.</p><button class="remix" type="button" aria-label="Remix hero colors" aria-pressed="false"><span>Remix the signal</span><span aria-hidden="true">↗</span></button></div>
    </section>
    <footer class="meta"><span>Art / Technology / Experiments</span><span class="hint">Move to bend. Tap to remix.</span><span>Seoul, KR ↗</span></footer>
  </main>
  <script src="./script.js"></script>
</body>
</html>
