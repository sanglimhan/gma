<!doctype html>
<html lang="en">
<head>

  <title>Generative Media Art Lab + Studio</title>

<body>
  <main class="poster" aria-labelledby="title">

      <span class="row row-one"><svg viewBox="0 20 1000 145" preserveAspectRatio="none" aria-hidden="true" focusable="false"><text x="12" y="157" textLength="976" lengthAdjust="spacingAndGlyphs">GENERATIVE</text></svg></span>
      <span class="row row-two"><svg viewBox="0 20 1000 145" preserveAspectRatio="none" aria-hidden="true" focusable="false"><text x="12" y="157" textLength="976" lengthAdjust="spacingAndGlyphs">MEDIA ART</text></svg></span>

    </h1>
    <div class="identity">
      <p class="row acronym" aria-label="GSAIM"><svg viewBox="0 20 1000 145" preserveAspectRatio="none" aria-hidden="true" focusable="false"><text x="12" y="157" textLength="976" lengthAdjust="spacingAndGlyphs">GSAIM</text></svg></p>
      <div class="location">
        <p class="row university" aria-label="CHUNG-ANG UNIV."><svg viewBox="0 20 1000 145" preserveAspectRatio="none" aria-hidden="true" focusable="false"><text x="12" y="157" textLength="976" lengthAdjust="spacingAndGlyphs">CHUNG-ANG UNIV.</text></svg></p>
        <p class="row city" aria-label="SEOUL, KOREA"><svg viewBox="0 20 1000 145" preserveAspectRatio="none" aria-hidden="true" focusable="false"><text x="12" y="157" textLength="976" lengthAdjust="spacingAndGlyphs">SEOUL, KOREA</text></svg></p>
      </div>
    </div>

  <script src="./script.js"></script>
