<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171A78">
    <title>Generative Media Art Lab + Studio</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="signal" aria-labelledby="signal-title">
      <canvas id="noise" aria-hidden="true"></canvas>
      <div class="blob-field" aria-hidden="true">
        <span class="blob blob-a"></span>
        <span class="blob blob-b"></span>
        <span class="blob blob-c"></span>
        <span class="blob blob-d"></span>
      </div>
      <div class="pointer-field" aria-hidden="true"></div>

      <section class="transmission">
        <header class="identity">
          <p class="university">Chung-Ang University</p>
          <p class="acronym">G S A I M</p>
        </header>

        <h1 id="signal-title" class="title">
          <span class="glitch-line line-one" data-text="Generative">Generative</span>
          <span class="glitch-line line-two" data-text="Media Art">Media Art</span>
          <span class="glitch-line line-three" data-text="Lab + Studio">Lab + Studio</span>
        </h1>
      </section>

      <div class="tear-field" aria-hidden="true"></div>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="edge-shade" aria-hidden="true"></div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
