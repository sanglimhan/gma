<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#151052">
    <title>Generative Media Art Lab + Studio</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="signal" aria-labelledby="signal-title">
      <canvas id="noise" aria-hidden="true"></canvas>
      <div class="interference" aria-hidden="true"></div>

      <section class="transmission">
        <p class="university signal-line" data-text="Chung-Ang University">Chung-Ang University</p>
        <p class="initials signal-line" data-text="G S A I M">G S A I M</p>
        <h1 id="signal-title" class="title">
          <span class="signal-line" data-text="Generative">Generative</span>
          <span class="signal-line" data-text="Media Art">Media Art</span>
          <span class="signal-line" data-text="Lab + Studio">Lab + Studio</span>
        </h1>
      </section>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
