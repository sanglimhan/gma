<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#151052">
    <title>Generative Media Art Lab + Studio</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="signal" aria-labelledby="signal-title">
      <canvas id="noise" aria-hidden="true"></canvas>
      <div class="color-wash" aria-hidden="true"></div>

      <section class="transmission">
        <p class="eyebrow">CH 01&nbsp;&nbsp;|&nbsp;&nbsp;LIVE GENERATIVE FEED</p>
        <h1 id="signal-title" class="title" data-text="GENERATIVE\A MEDIA ART\A LAB + STUDIO">
          <span>GENERATIVE</span>
          <span>MEDIA ART</span>
          <span>LAB + STUDIO</span>
        </h1>
        <div class="phrase-window" aria-live="polite">
          <p id="phrase">CAU GMA</p>
        </div>
      </section>

      <div class="telemetry" aria-hidden="true">
        <span>REC ●</span>
        <span>NTSC / 29.97</span>
      </div>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
